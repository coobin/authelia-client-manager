[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "authelia-client-manager"
version = "0.2.0"
description = "Self-hosted OIDC client management with guarded Authelia deployments"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "ruamel.yaml>=0.18,<0.20", "argon2-cffi>=23,<26", "pyotp>=2.9,<3", "cryptography>=44,<49", "docker>=7,<8", "PyJWT>=2.10,<3"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
